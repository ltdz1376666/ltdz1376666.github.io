name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Copy dist to root
        run: |
          # 删除根目录中的旧文件（除了.git和必要的文件）
          find . -maxdepth 1 -type f ! -name '.git*' ! -name 'README.md' ! -name 'LICENSE' ! -name 'DEPLOY_GUIDE.md' ! -name 'README_CN.md' ! -name 'package.json' ! -name 'pnpm-lock.yaml' ! -name 'vite.config.ts' ! -name 'tsconfig.json' ! -name 'tsconfig.node.json' ! -name 'components.json' ! -name 'wrangler.toml' ! -name 'ideas.md' ! -name '.gitignore' -delete
          # 删除根目录中的目录（除了.git和source目录）
          find . -maxdepth 1 -type d ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'client' ! -name 'shared' ! -name 'node_modules' ! -name 'dist' -exec rm -rf {} + 2>/dev/null || true
          # 复制dist中的所有文件到根目录
          cp -r dist/* .
          # 删除dist目录
          rm -rf dist

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Deploy: Update GitHub Pages" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
